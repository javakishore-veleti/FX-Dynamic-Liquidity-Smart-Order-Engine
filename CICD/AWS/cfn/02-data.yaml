AWSTemplateFormatVersion: "2010-09-09"
Description: >
  fx-topology data tier. RDS PostgreSQL with the master password managed by Secrets Manager
  (no password in parameters or in the repo). Reachable only from topology tasks.

Parameters:
  ProjectName:
    Type: String
    Default: fx-topology
  SubnetA:
    Type: String
  SubnetB:
    Type: String
  DbSecurityGroupId:
    Type: String
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorageGb:
    Type: Number
    Default: 20

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database subnets"
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorageGb
      StorageType: gp3
      DBName: fx_topology_db
      MasterUsername: fx_sor
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroupId]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags: [{Key: Name, Value: !Sub "${ProjectName}-db"}]

Outputs:
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: {Name: !Sub "${ProjectName}-db-endpoint"}
  DbSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
    Export: {Name: !Sub "${ProjectName}-db-secret-arn"}
