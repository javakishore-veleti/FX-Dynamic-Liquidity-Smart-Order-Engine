spring:
  application:
    name: fx-topology-service
  threads:
    virtual:
      enabled: true
  # Dedicated DB per microservice (no shared schema). Cross-service data via API only.
  datasource:
    url: jdbc:h2:mem:fx_topology_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: ${SERVER_PORT:8085}

fx:
  features:
    redis-enabled: false
    kafka-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: fx-topology-service
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}

logging:
  level:
    root: INFO
    com.jk.apps.banking.fx.sor.topology: INFO
    liquibase: INFO

---
# Dedicated PostgreSQL database for this service only
spring:
  config:
    activate:
      on-profile: local-postgres
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/fx_topology_db
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:fx_sor}
    password: ${POSTGRES_PASSWORD:fx_sor}
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# Enable Redis L2 (feature toggle ON). Aliases: local-redis, load-redis
spring:
  config:
    activate:
      on-profile: local-redis | load-redis
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
fx:
  features:
    redis-enabled: true

---
# Enable Kafka topology ingestion (feature toggle ON). Aliases: local-kafka, load-kafka
spring:
  config:
    activate:
      on-profile: local-kafka | load-kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
fx:
  features:
    kafka-enabled: true
