[project]
name = "fx-model-tuning"
version = "1.0.0"
description = "FX Model Fine-Tuning & Distillation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "import-linter>=2.1,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_model_tuning"]

[tool.uv]
package = true
