syntax = "proto3";

// Read-only quote API. REST and gRPC are kept in step; the SSE quote stream stays on REST.
package fx.quote.v1;

option java_multiple_files = true;
option java_package = "com.jk.apps.banking.fx.sor.quote.grpc.v1";
option java_outer_classname = "QuoteReadProto";

service QuoteRead {
  rpc ListSpreadSchedules(Empty) returns (SpreadScheduleList);
  rpc ListLpBook(Empty) returns (LpQuoteList);
  rpc ListEconomicCalendar(Empty) returns (CalendarEventList);
  rpc GetMacroFlag(Empty) returns (MacroFlag);
  rpc RegimeContext(RegimeContextRequest) returns (RegimeContextReply);
}

message Empty {}

message SpreadSchedule {
  string tier_id = 1;
  string ccy_pair = 2;
  string session_regime = 3;
  string markup_bps = 4;
  string news_multiplier = 5;
  string effective_from = 6;
  string approved_by = 7;
  string status = 8;
  string purpose_note = 9;
}

message SpreadScheduleList {
  repeated SpreadSchedule schedules = 1;
}

message LpQuote {
  string ccy_pair = 1;
  string lp_id = 2;
  string bid = 3;
  string ask = 4;
  string available_size = 5;
  int64 quote_ts = 6;
  int64 ttl_ms = 7;
}

message LpQuoteList {
  repeated LpQuote quotes = 1;
}

message CalendarEvent {
  string source = 1;
  string severity = 2;
  string start = 3;
  string end = 4;
  string label = 5;
  bool active_now = 6;
}

message CalendarEventList {
  repeated CalendarEvent events = 1;
}

message MacroFlag {
  bool active = 1;
  string regime = 2;
  string source = 3;
  string severity = 4;
  string expires_at = 5;
  string last_look_penalty_weight = 6;
  string armed_by = 7;
}

message RegimeContextRequest {
  string client_tier = 1;
  string ccy_pair = 2;
}

message RegimeContextReply {
  string session_regime = 1;
  bool macro_active = 2;
  string last_look_penalty_weight = 3;
  string sample_markup_bps = 4;
}
