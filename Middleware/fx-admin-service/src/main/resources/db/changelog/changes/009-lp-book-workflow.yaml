databaseChangeLog:
  - changeSet:
      id: admin-009-seed-initial-data-workflow-lp-book
      author: fx-sor
      comment: Master definition for the Initial Data workflow (LP top-of-book starter). Purpose marks it as seed.
      changes:
        - insert:
            tableName: workflows
            columns:
              - column: { name: workflow_key, value: INIT_LP_BOOK }
              - column: { name: name, value: "Initial Data · LP Top-of-Book" }
              - column:
                  name: description
                  value: "Load the starter LP top-of-book into fx-quote-service and verify the rows"
              - column: { name: bpmn_resource, value: bpmn/init-lp-book.bpmn20.xml }
              - column: { name: version, value: "1.0" }
              - column: { name: portal_scope, value: ADMIN }
              - column: { name: status, value: ACTIVE }
              - column: { name: fr_id, value: INITIAL_DATA }
              - column: { name: purpose, value: INITIAL_DATA_SETUP }
