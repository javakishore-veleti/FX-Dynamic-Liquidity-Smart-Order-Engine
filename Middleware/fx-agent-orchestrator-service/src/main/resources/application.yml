spring:
  application:
    name: fx-agent-orchestrator-service
  threads:
    virtual:
      enabled: true
  # Dedicated DB per microservice (no shared schema). Cross-service data via API only.
  datasource:
    url: jdbc:h2:mem:fx_agent_orchestrator_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    # When false, run external: npm run local:middleware:liquibase:all:start
    enabled: ${LIQUIBASE_ON_STARTUP:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

server:
  port: ${SERVER_PORT:8092}
  address: ${SERVER_ADDRESS:0.0.0.0}

fx:
  features:
    redis-enabled: false
    kafka-enabled: false
    liquibase-on-startup: ${LIQUIBASE_ON_STARTUP:true}
  mcp:
    base-url: ${FX_MCP_BASE_URL:http://localhost:8091}
  llm:
    # OPENAI_COMPAT = LiteLLM fx-llm-gateway (recommended polyglot router)
    provider: ${LLM_PROVIDER:OPENAI_COMPAT}
    openai-compatible:
      base-url: ${LLM_GATEWAY_URL:http://localhost:4000}
      api-key: ${LLM_GATEWAY_KEY:sk-local-fx-sor}
      reasoning-model: ${LLM_REASONING_MODEL:fx-reasoning-tier}
      fast-model: ${LLM_FAST_MODEL:fx-fast-triage-tier}
      graph-model: ${LLM_GRAPH_MODEL:fx-graph-tier}
      embedding-model: ${LLM_EMBEDDING_MODEL:fx-embedding-tier}
    bedrock:
      region: ${BEDROCK_REGION:us-east-1}
      reasoning-model: ${BEDROCK_REASONING_MODEL:us.anthropic.claude-3-7-sonnet-20250219-v1:0}
      fast-model: ${BEDROCK_FAST_MODEL:us.amazon.nova-lite-v1:0}
      embedding-model: ${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v2:0}
      guardrail-id: ${BEDROCK_GUARDRAIL_ID:}
    huggingface:
      endpoint-url: ${HF_ENDPOINT_URL:https://api-inference.huggingface.co}
      reasoning-model: ${HF_REASONING_MODEL:Qwen/Qwen2.5-72B-Instruct}
      embedding-model: ${HF_EMBEDDING_MODEL:BAAI/bge-m3}
    local-ollama:
      base-url: ${LOCAL_OLLAMA_BASE_URL:http://localhost:11434}
      reasoning-model: ${LOCAL_REASONING_MODEL:qwen2.5:14b}
  a2a:
    agent-card-path: /.well-known/agent.json
    peer-python-card-url: ${A2A_PEER_PYTHON_CARD_URL:http://localhost:8192/.well-known/agent.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      service: fx-agent-orchestrator-service
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}

logging:
  level:
    root: INFO
    com.jk.apps.banking.fx.sor.agent: INFO
    liquibase: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

---
# Dedicated PostgreSQL database for this service only
spring:
  config:
    activate:
      on-profile: local-postgres
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/fx_agent_orchestrator_db
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:fx_sor}
    password: ${POSTGRES_PASSWORD:fx_sor}
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# Enable Redis L2 (feature toggle ON). Aliases: local-redis, load-redis
spring:
  config:
    activate:
      on-profile: local-redis | load-redis
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
fx:
  features:
    redis-enabled: true

---
# Enable Kafka provenance/events (feature toggle ON). Aliases: local-kafka, load-kafka
spring:
  config:
    activate:
      on-profile: local-kafka | load-kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
fx:
  features:
    kafka-enabled: true
