syntax = "proto3";

// Read-only topology API (premises P1-P11, REST and gRPC kept in step).
// Writes are not part of this contract: ingest stays on Kafka and REST.
package fx.topology.v1;

option java_multiple_files = true;
option java_package = "com.jk.apps.banking.fx.sor.topology.grpc.v1";
option java_outer_classname = "TopologyReadProto";

service TopologyRead {
  rpc NetworkGraph(NetworkGraphRequest) returns (NetworkGraphResponse);
  rpc NetworkAt(NetworkAtRequest) returns (NetworkEdgeList);
  rpc NetworkPage(NetworkPageRequest) returns (NetworkPageResponse);
  rpc MergedGraph(MergedGraphRequest) returns (MergedEdgeList);
  rpc IpcGraph(IpcGraphRequest) returns (IpcGraphResponse);
  rpc TraceOutliers(TraceOutliersRequest) returns (TraceOutliersResponse);
  rpc RootSource(RootSourceRequest) returns (RootSourceList);
  rpc Mutations(MutationsRequest) returns (MutationList);
  rpc Diff(DiffRequest) returns (DiffResponse);
  rpc BlastRadius(BlastRadiusRequest) returns (BlastRadiusResponse);
}

message NetworkEdge {
  string id = 1;
  string src_service = 2;
  string dst_service = 3;
  string time_bucket = 4;
  string pod_namespace = 5;
  string az_zone = 6;
  string egress_lp_gateway = 7;
  int32 socket_retransmits = 8;
  int64 flow_count = 9;
}

message NetworkGraphRequest {
  string service = 1;
  int32 depth = 2;
  int32 fresh_minutes = 3;
}

message NetworkGraphResponse {
  string service = 1;
  int32 depth = 2;
  repeated NetworkEdge edges = 3;
}

message NetworkAtRequest {
  string bucket = 1;
}

message NetworkEdgeList {
  repeated NetworkEdge edges = 1;
}

message NetworkPageRequest {
  string service = 1;
  int32 depth = 2;
  int32 page = 3;
  int32 size = 4;
}

message NetworkPageResponse {
  int32 page = 1;
  int32 size = 2;
  int32 total = 3;
  repeated NetworkEdge edges = 4;
}

message MergedGraphRequest {
  int32 fresh_minutes = 1;
}

message MergedEdge {
  string src = 1;
  string dst = 2;
  repeated string layers = 3;
  int32 agreement = 4;
}

message MergedEdgeList {
  repeated MergedEdge edges = 1;
}

message IpcEdge {
  string id = 1;
  string src_service = 2;
  string dst_service = 3;
  string ccy_pair = 4;
  string window = 5;
  string availability_tier = 6;
  string desk_owner = 7;
  double stp_fill_pct = 8;
  string circuit_state = 9;
}

message IpcGraphRequest {
  string ccy_pair = 1;
  string window = 2;
}

message IpcGraphResponse {
  string ccy_pair = 1;
  string window = 2;
  repeated IpcEdge edges = 3;
}

message TraceOutliersRequest {
  double min_latency_ms = 1;
  string service_name = 2;
}

message TraceOutlier {
  string id = 1;
  string service_name = 2;
  string client_order_id = 3;
  string knockout_reason = 4;
  string winning_lp_id = 5;
  double latency_ms = 6;
}

message TraceOutliersResponse {
  double min_latency_ms = 1;
  string service_name = 2;
  repeated TraceOutlier outliers = 3;
}

message RootSourceRequest {
  double threshold_ms = 1;
}

message RootCandidate {
  string service = 1;
  int32 degraded_callers = 2;
}

message RootSourceList {
  repeated RootCandidate candidates = 1;
}

message MutationsRequest {
  string src = 1;
  string dst = 2;
}

message Mutation {
  string id = 1;
  string src_service = 2;
  string dst_service = 3;
  string property = 4;
  string old_value = 5;
  string new_value = 6;
  string changed_at = 7;
}

message MutationList {
  repeated Mutation mutations = 1;
}

message DiffRequest {
  string from = 1;
  string to = 2;
}

message DiffResponse {
  string from = 1;
  string to = 2;
  int32 from_edge_count = 3;
  int32 to_edge_count = 4;
  int32 edge_delta = 5;
  repeated string nodes_added = 6;
  repeated string nodes_removed = 7;
}

message BlastRadiusRequest {
  string service_name = 1;
  string ccy_pair = 2;
  int32 depth = 3;
}

message BlastRadiusResponse {
  string service_name = 1;
  string ccy_pair = 2;
  int32 depth = 3;
  repeated string impacted_services = 4;
  repeated NetworkEdge network_edges = 5;
  repeated IpcEdge ipc_edges = 6;
}
