AWSTemplateFormatVersion: "2010-09-09"
Description: Container registry for the fx-topology-service image.

Parameters:
  ProjectName:
    Type: String
    Default: fx-topology

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-service"
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export: {Name: !Sub "${ProjectName}-ecr-uri"}
