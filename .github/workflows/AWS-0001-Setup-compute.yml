name: AWS-0001-Setup-compute

on:
  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy compute stack
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          REPO=$(out fx-topology-ecr RepositoryUri)
          VPC=$(out fx-topology-network VpcId)
          SUBNET_A=$(out fx-topology-network SubnetA)
          SUBNET_B=$(out fx-topology-network SubnetB)
          ALB_SG=$(out fx-topology-network AlbSecurityGroupId)
          APP_SG=$(out fx-topology-network AppSecurityGroupId)
          DB_ENDPOINT=$(out fx-topology-data DbEndpoint)
          DB_SECRET=$(out fx-topology-data DbSecretArn)
          aws cloudformation deploy --stack-name fx-topology-compute --template-file CICD/AWS/cfn/04-compute.yaml --capabilities CAPABILITY_IAM --parameter-overrides VpcId=$VPC SubnetA=$SUBNET_A SubnetB=$SUBNET_B AlbSecurityGroupId=$ALB_SG AppSecurityGroupId=$APP_SG ImageUri="$REPO:latest" DbEndpoint=$DB_ENDPOINT DbSecretArn="$DB_SECRET" --no-fail-on-empty-changeset
          echo "Service address: http://$(out fx-topology-compute LoadBalancerDns)/actuator/health"
