# FX SOR Local AIOps — OTel + Prometheus + Grafana + OpenSearch (+ optional Holmes)
# Does not replace Redis/Postgres/Kafka; compose alongside LLM-Gateway.
name: fx-sor-aiops

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: fx-sor-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fx-sor-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: fx-sor-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fxsor}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: fx-sor-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: fx-sor-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    restart: unless-stopped

  # Lightweight AIOps triage stub that forwards investigation prompts to LiteLLM.
  # Replace image with robustadev/holmes when pinning a stable public tag for your env.
  holmes-stub:
    image: python:3.12-slim
    container_name: fx-sor-holmes-stub
    working_dir: /app
    volumes:
      - ./holmes-stub:/app:ro
    environment:
      LLM_GATEWAY_URL: http://host.docker.internal:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-fx-sor}
    command: ["python", "server.py"]
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["holmes"]
    restart: unless-stopped
