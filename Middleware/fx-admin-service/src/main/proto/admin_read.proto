syntax = "proto3";

// Read-only admin API. Loosely typed control-plane payloads use google.protobuf.Struct.
package fx.admin.v1;

import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_package = "com.jk.apps.banking.fx.sor.admin.grpc.v1";
option java_outer_classname = "AdminReadProto";

service AdminRead {
  rpc ListWorkflowDefinitions(WorkflowFilter) returns (WorkflowDefinitionList);
  rpc ListInitialData(Empty) returns (InitialDataList);
  rpc ListSpreadSchedules(Empty) returns (StructList);
  rpc GetMacroFlag(Empty) returns (google.protobuf.Struct);
  rpc ListEconomicCalendar(Empty) returns (StructList);
  rpc ListLpBook(Empty) returns (StructList);
  rpc ListLpRankings(Empty) returns (StructList);
  rpc ListSettlementPolicies(Empty) returns (StructList);
  rpc ListCreditLines(Empty) returns (StructList);
  rpc ListWorkflows(WorkflowsRequest) returns (StructList);
  rpc GetWorkflow(WorkflowId) returns (google.protobuf.Struct);
  rpc GetBpmnExecution(WorkflowId) returns (google.protobuf.Struct);
}

message Empty {}

message StructList {
  repeated google.protobuf.Struct items = 1;
}

message WorkflowId {
  string wf_exec_id = 1;
}

message WorkflowsRequest {
  string status = 1;
  string workflow_type = 2;
  string workflow_key = 3;
  string triggered_by = 4;
  int32 page = 5;
  int32 size = 6;
}

message WorkflowFilter {
  string portal_scope = 1;
}

message WorkflowDefinition {
  string workflow_key = 1;
  string name = 2;
  string bpmn_resource = 3;
  string version = 4;
  string portal_scope = 5;
  string status = 6;
  string fr_id = 7;
  string purpose = 8;
}

message WorkflowDefinitionList {
  repeated WorkflowDefinition definitions = 1;
}

message InitialDataset {
  string dataset_key = 1;
  string title = 2;
  string owner_service = 3;
  string workflow_key = 4;
  string setup_status = 5;
  bool setup_allowed = 6;
  string completed_at = 7;
}

message InitialDataList {
  repeated InitialDataset datasets = 1;
}
