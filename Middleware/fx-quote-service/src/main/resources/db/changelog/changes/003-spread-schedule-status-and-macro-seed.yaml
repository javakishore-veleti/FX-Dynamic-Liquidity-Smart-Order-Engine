databaseChangeLog:
  - changeSet:
      id: quote-003-add-status-column
      author: fx-sor
      changes:
        - addColumn:
            tableName: client_tier_spread_schedules
            columns:
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
  - changeSet:
      id: quote-003-seed-regime-matrix
      author: fx-sor
      comment: Expand EURUSD TIER_2 regimes including MACRO_NEWS_HIGH for FR-01
      changes:
        - insert:
            tableName: client_tier_spread_schedules
            columns:
              - column: { name: tier_id, value: TIER_2 }
              - column: { name: ccy_pair, value: EURUSD }
              - column: { name: session_regime, value: MACRO_NEWS_HIGH }
              - column: { name: markup_bps, valueNumeric: 2.5000 }
              - column: { name: news_multiplier, valueNumeric: 1.50 }
              - column: { name: effective_from, value: "2026-01-01T00:00:00Z" }
              - column: { name: approved_by, value: SYSTEM_SEED }
              - column: { name: status, value: ACTIVE }
