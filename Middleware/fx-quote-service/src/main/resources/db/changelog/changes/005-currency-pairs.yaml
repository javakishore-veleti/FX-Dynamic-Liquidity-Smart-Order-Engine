databaseChangeLog:
  - changeSet:
      id: quote-005-currency-pairs
      author: fx-sor
      comment: Currency pair master. Owned by fx-quote-service; other services reference pair_code as a plain column.
      changes:
        - createTable:
            tableName: currency_pairs
            columns:
              - column:
                  name: pair_code
                  type: varchar(10)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_currency_pairs
                    nullable: false
              - column:
                  name: base_ccy
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: quote_ccy
                  type: varchar(3)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  defaultValue: SYSTEM
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: varchar(100)
                  defaultValue: SYSTEM
                  constraints:
                    nullable: false
