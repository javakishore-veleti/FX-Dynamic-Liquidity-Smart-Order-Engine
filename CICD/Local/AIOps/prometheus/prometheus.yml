global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: fx-llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  # Host-published Spring Boot actuators (H2 local defaults)
  - job_name: fx-middleware-actuators
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8084
          - host.docker.internal:8085
          - host.docker.internal:8091
          - host.docker.internal:8092
        labels:
          stack: middleware

  - job_name: fx-python-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8192"]
        labels:
          stack: agentic-python
