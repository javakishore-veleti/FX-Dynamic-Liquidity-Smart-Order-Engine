AWSTemplateFormatVersion: "2010-09-09"
Description: >
  fx-topology compute tier. ECS Fargate service running the topology image behind an internet-facing
  Application Load Balancer. The database password is read from Secrets Manager by the task, never
  stored in the template.

Parameters:
  ProjectName:
    Type: String
    Default: fx-topology
  VpcId:
    Type: String
  SubnetA:
    Type: String
  SubnetB:
    Type: String
  AlbSecurityGroupId:
    Type: String
  AppSecurityGroupId:
    Type: String
  ImageUri:
    Type: String
    Description: Full image reference, for example <account>.dkr.ecr.<region>.amazonaws.com/fx-topology-service:latest
  DbEndpoint:
    Type: String
  DbSecretArn:
    Type: String
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024"]
  TaskMemory:
    Type: String
    Default: "1024"
  DesiredCount:
    Type: Number
    Default: 1

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: 14

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecretArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: topology
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8085
              Protocol: tcp
          Environment:
            - {Name: SERVER_PORT, Value: "8085"}
            - {Name: SPRING_PROFILES_ACTIVE, Value: local-postgres}
            - {Name: POSTGRES_HOST, Value: !Ref DbEndpoint}
            - {Name: POSTGRES_PORT, Value: "5432"}
            - {Name: POSTGRES_USER, Value: fx_sor}
            - {Name: FX_FEATURES_KAFKA_ENABLED, Value: "false"}
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DbSecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: topology

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbSecurityGroupId]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      Port: 8085
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /actuator/health
      HealthCheckIntervalSeconds: 30
      Matcher: {HttpCode: "200"}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref AppSecurityGroupId]
      LoadBalancers:
        - ContainerName: topology
          ContainerPort: 8085
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  ServiceName:
    Value: !GetAtt Service.Name
